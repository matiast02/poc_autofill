<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PoC - Autofill Data Extraction</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }

    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #f8fafc; }
    .subtitle { color: #94a3b8; margin-bottom: 2rem; font-size: 0.9rem; text-align: center; }

    /* --- Language toggle --- */
    .lang-toggle {
      position: fixed; top: 1rem; right: 1rem; z-index: 100;
      display: flex; border-radius: 8px; overflow: hidden;
      border: 1px solid #334155; background: #1e293b;
    }
    .lang-btn {
      padding: 0.4rem 0.9rem; border: none; cursor: pointer;
      font-size: 0.8rem; font-weight: 600; transition: all .2s;
      background: transparent; color: #94a3b8;
    }
    .lang-btn.active { background: #6366f1; color: #fff; }
    .lang-btn:hover:not(.active) { background: #334155; }

    /* --- Technique selector tabs --- */
    .tabs {
      display: flex; flex-wrap: wrap; gap: 0.5rem;
      justify-content: center; max-width: 1200px; margin-bottom: 1.5rem;
    }

    .tab-btn {
      padding: 0.5rem 1rem; background: #1e293b;
      border: 1px solid #334155; border-radius: 8px;
      color: #94a3b8; font-size: 0.8rem; cursor: pointer; transition: all .2s;
    }
    .tab-btn:hover { border-color: #6366f1; color: #c7d2fe; }
    .tab-btn.active { background: #6366f1; border-color: #6366f1; color: #fff; font-weight: 600; }
    .tab-btn.result-filled { background: #991b1b; border-color: #dc2626; color: #fecaca; font-weight: 600; }
    .tab-btn.result-filled.active { background: #dc2626; border-color: #dc2626; color: #fff; }
    .tab-btn.result-blocked { background: #14532d; border-color: #22c55e; color: #bbf7d0; font-weight: 600; }
    .tab-btn.result-blocked.active { background: #16a34a; border-color: #16a34a; color: #fff; }

    .technique-info {
      background: #1e293b; border: 1px solid #334155; border-radius: 12px;
      padding: 1.25rem 1.5rem; max-width: 1200px; width: 100%; margin-bottom: 1.5rem;
    }
    .technique-info h3 { font-size: 0.95rem; color: #f8fafc; margin-bottom: 0.5rem; }
    .technique-info .css-code {
      background: #0f172a; border: 1px solid #334155; border-radius: 6px;
      padding: 0.75rem 1rem; font-family: 'Courier New', monospace;
      font-size: 0.8rem; color: #a5b4fc; margin-bottom: 0.75rem; white-space: pre;
    }
    .technique-info .expectation { font-size: 0.8rem; color: #94a3b8; line-height: 1.6; }
    .technique-info .expectation strong { color: #fbbf24; }

    .container {
      display: flex; gap: 2rem; width: 100%; max-width: 1200px;
      flex-wrap: wrap; justify-content: center;
    }

    /* --- Fake form --- */
    .fake-site {
      background: #fff; color: #1e293b; border-radius: 12px;
      padding: 2rem; width: 380px; box-shadow: 0 4px 24px rgba(0,0,0,.4);
      max-height: 480px; overflow-y: auto;
    }
    .fake-site h2 { font-size: 1.2rem; margin-bottom: 0.25rem; }
    .fake-site .tagline { font-size: 0.8rem; color: #64748b; margin-bottom: 1.5rem; }
    .fake-site label {
      display: block; font-size: 0.8rem; font-weight: 600;
      color: #475569; margin-bottom: 0.3rem;
    }
    .fake-site input[type="text"],
    .fake-site input[type="email"] {
      width: 100%; padding: 0.6rem 0.75rem; border: 1px solid #cbd5e1;
      border-radius: 8px; font-size: 0.9rem; margin-bottom: 1rem;
      outline: none; transition: border-color .2s;
    }
    .fake-site input:focus {
      border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.15);
    }
    .fake-site button {
      width: 100%; padding: 0.7rem; background: #6366f1; color: #fff;
      border: none; border-radius: 8px; font-size: 0.95rem;
      font-weight: 600; cursor: pointer; transition: background .2s;
    }
    .fake-site button:hover { background: #4f46e5; }

    /* ====== HIDING TECHNIQUES ====== */
    .hide-offscreen { position: absolute; left: -9999px; top: -9999px; }
    .hide-display-none { display: none; }
    .hide-visibility { visibility: hidden; height: 0; overflow: hidden; }
    .hide-opacity { opacity: 0; height: 0; overflow: hidden; }
    .hide-transform { transform: scale(0); height: 0; overflow: hidden; position: absolute; }
    .hide-clip-path { clip-path: inset(100%); position: absolute; }
    .hide-size-zero {
      font-size: 0; color: transparent; height: 0; width: 0;
      overflow: hidden; padding: 0; border: 0;
    }
    .hide-z-index {
      position: absolute; z-index: -1; opacity: 0.01;
      top: 0; left: 0; width: 1px; height: 1px; overflow: hidden;
    }
    .hide-overflow-clip {
      position: absolute; width: 1px; height: 1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; padding: 0;
    }
    .hide-content-visibility { content-visibility: hidden; height: 0; overflow: hidden; }
    .hide-contain { contain: strict; height: 0; width: 0; overflow: hidden; }
    .hide-pointer-events { pointer-events: none; opacity: 0; position: absolute; height: 0; overflow: hidden; }
    .hide-details summary { display: none; }
    .hide-details { height: 0; overflow: hidden; }

    /* --- Results panel --- */
    .results {
      background: #1e293b; border: 1px solid #334155; border-radius: 12px;
      padding: 2rem; width: 520px; box-shadow: 0 4px 24px rgba(0,0,0,.4);
      max-height: 480px; overflow-y: auto;
    }
    .results h2 { font-size: 1.1rem; margin-bottom: 1rem; color: #f1f5f9; }
    .result-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.45rem 0; border-bottom: 1px solid #334155; font-size: 0.82rem;
    }
    .result-row:last-child { border-bottom: none; }
    .result-label { color: #94a3b8; min-width: 130px; }
    .result-value {
      color: #f8fafc; font-family: 'Courier New', monospace;
      font-size: 0.78rem; text-align: right; word-break: break-all;
    }
    .result-value.empty { color: #475569; font-style: italic; }
    .result-value.captured { color: #f87171; font-weight: 600; }

    .badge {
      display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px;
      font-size: 0.65rem; font-weight: 600; margin-left: 0.4rem;
    }
    .badge.visible { background: #166534; color: #bbf7d0; }
    .badge.hidden  { background: #991b1b; color: #fecaca; }
    .badge.blocked { background: #1e3a5f; color: #93c5fd; }

    .warning-box {
      background: #451a03; border: 1px solid #92400e; border-radius: 8px;
      padding: 1rem; margin-top: 1.25rem; font-size: 0.8rem;
      color: #fbbf24; line-height: 1.5;
    }

    /* --- Vulnerability score --- */
    .score-panel {
      background: #1e293b; border: 1px solid #334155; border-radius: 12px;
      padding: 1.5rem; max-width: 1200px; width: 100%; margin-top: 2rem;
      display: none;
    }
    .score-panel.visible { display: block; }
    .score-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .score-header h2 { font-size: 1.1rem; color: #f1f5f9; margin: 0; }
    .score-stats { display: flex; gap: 2rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .score-stat {
      text-align: center; padding: 1rem 1.5rem; border-radius: 10px;
      background: #0f172a; border: 1px solid #334155; min-width: 120px;
    }
    .score-stat .number { font-size: 2rem; font-weight: 700; line-height: 1; }
    .score-stat .label { font-size: 0.75rem; color: #94a3b8; margin-top: 0.35rem; }
    .score-bar-container {
      background: #0f172a; border-radius: 999px; height: 28px; overflow: hidden;
      border: 1px solid #334155; position: relative;
    }
    .score-bar {
      height: 100%; border-radius: 999px; transition: width 0.6s ease, background 0.4s ease;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 700; color: #fff; min-width: 40px;
    }
    .score-bar-label {
      font-size: 0.8rem; color: #94a3b8; margin-top: 0.5rem; text-align: center;
    }

    /* --- QR Modal --- */
    .qr-btn {
      padding: 0.4rem 1rem; background: #334155; border: 1px solid #475569;
      border-radius: 8px; color: #94a3b8; font-size: 0.8rem; cursor: pointer;
      transition: all .2s; position: fixed; bottom: 1rem; right: 1rem; z-index: 100;
    }
    .qr-btn:hover { background: #6366f1; border-color: #6366f1; color: #fff; }
    .qr-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7);
      z-index: 200; align-items: center; justify-content: center;
    }
    .qr-overlay.visible { display: flex; }
    .qr-modal {
      background: #1e293b; border: 1px solid #334155; border-radius: 16px;
      padding: 2rem; text-align: center; max-width: 340px;
    }
    .qr-modal h3 { color: #f1f5f9; margin-bottom: 0.5rem; font-size: 1rem; }
    .qr-modal p { color: #94a3b8; font-size: 0.8rem; margin-bottom: 1rem; }
    .qr-modal canvas { border-radius: 8px; background: #fff; padding: 12px; }
    .qr-modal .qr-url { color: #6366f1; font-size: 0.75rem; margin-top: 0.75rem; word-break: break-all; }
    .qr-close {
      margin-top: 1rem; padding: 0.4rem 1.5rem; background: #475569; border: none;
      border-radius: 8px; color: #e2e8f0; cursor: pointer; font-size: 0.8rem;
    }
    .qr-close:hover { background: #64748b; }

    /* --- Reset button --- */
    .reset-btn {
      padding: 0.4rem 1rem; background: #334155; border: 1px solid #475569;
      border-radius: 8px; color: #94a3b8; font-size: 0.8rem; cursor: pointer;
      transition: all .2s;
    }
    .reset-btn:hover { background: #dc2626; border-color: #dc2626; color: #fff; }

    /* --- Comparison table --- */
    .comparison {
      background: #1e293b; border: 1px solid #334155; border-radius: 12px;
      padding: 1.5rem; max-width: 1200px; width: 100%; margin-top: 1rem;
    }
    .comparison h2 { font-size: 1.1rem; margin-bottom: 1rem; color: #f1f5f9; }
    .comparison table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .comparison th {
      text-align: left; padding: 0.6rem 0.75rem; background: #0f172a;
      color: #94a3b8; border-bottom: 1px solid #334155; font-weight: 600; font-size: 0.75rem;
    }
    .comparison td {
      padding: 0.5rem 0.75rem; border-bottom: 1px solid #1e293b; color: #e2e8f0;
    }
    .comparison tr:hover td { background: #334155; }
    .comparison td.status-filled { color: #f87171; font-weight: 600; }
    .comparison td.status-blocked { color: #4ade80; font-weight: 600; }
    .comparison td.status-pending { color: #475569; }
    .status-filled { color: #f87171; font-weight: 600; }
    .status-blocked { color: #4ade80; font-weight: 600; }
    .status-pending { color: #475569; }

    /* --- Recommendations --- */
    .recs-panel {
      background: #1e293b; border: 1px solid #334155; border-radius: 12px;
      padding: 1.5rem; max-width: 1200px; width: 100%; margin-top: 1rem;
      display: none;
    }
    .recs-panel.visible { display: block; }
    .recs-panel h2 { font-size: 1.1rem; margin-bottom: 0.75rem; color: #f1f5f9; }
    .recs-severity {
      padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1rem;
      font-size: 0.85rem; font-weight: 600;
    }
    .recs-severity.critical { background: #7f1d1d; color: #fca5a5; border: 1px solid #dc2626; }
    .recs-severity.high { background: #7c2d12; color: #fed7aa; border: 1px solid #f97316; }
    .recs-severity.medium { background: #78350f; color: #fde68a; border: 1px solid #fbbf24; }
    .recs-severity.low { background: #14532d; color: #bbf7d0; border: 1px solid #22c55e; }
    .recs-severity.safe { background: #14532d; color: #bbf7d0; border: 1px solid #22c55e; }
    .recs-intro { font-size: 0.85rem; color: #94a3b8; margin-bottom: 1rem; }
    .rec-item {
      display: flex; gap: 0.75rem; padding: 0.75rem 0;
      border-bottom: 1px solid #334155; align-items: flex-start;
    }
    .rec-item:last-child { border-bottom: none; }
    .rec-icon {
      flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%;
      background: #334155; display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; margin-top: 0.1rem;
    }
    .rec-content h4 { font-size: 0.85rem; color: #f1f5f9; margin-bottom: 0.2rem; }
    .rec-content p { font-size: 0.78rem; color: #94a3b8; line-height: 1.5; }

    /* --- Presentation mode --- */
    .pres-btn {
      position: fixed; top: 1rem; right: 8rem; z-index: 100;
      padding: 0.4rem 0.9rem; border: 1px solid #334155; background: #1e293b;
      border-radius: 8px; color: #94a3b8; font-size: 0.8rem; cursor: pointer;
      font-weight: 600; transition: all .2s;
    }
    .pres-btn:hover { background: #334155; }
    .pres-btn.active { background: #6366f1; border-color: #6366f1; color: #fff; }

    body.presentation-mode .instructions { display: none; }
    body.presentation-mode .technique-info .css-code { display: none; }
    body.presentation-mode .technique-info .expectation { font-size: 1rem; }
    body.presentation-mode .technique-info h3 { font-size: 1.3rem; }
    body.presentation-mode h1 { font-size: 2rem; }
    body.presentation-mode .subtitle { font-size: 1.1rem; }
    body.presentation-mode .tab-btn { font-size: 0.95rem; padding: 0.6rem 1.2rem; }
    body.presentation-mode .fake-site h2 { font-size: 1.4rem; }
    body.presentation-mode .results h2 { font-size: 1.3rem; }
    body.presentation-mode .result-row { font-size: 0.95rem; }
    body.presentation-mode .score-stat .number { font-size: 2.5rem; }
    body.presentation-mode .score-stat .label { font-size: 0.9rem; }
    body.presentation-mode .score-bar { font-size: 0.95rem; height: 36px; }
    body.presentation-mode .score-bar-container { height: 36px; }
    body.presentation-mode .score-bar-label { font-size: 1rem; }
    body.presentation-mode .comparison { font-size: 0.9rem; }
    body.presentation-mode .comparison th { font-size: 0.85rem; }
    body.presentation-mode .warning-box { display: none; }
    body.presentation-mode .recs-panel { display: none !important; }

    .instructions {
      background: #1e293b; border: 1px solid #334155; border-radius: 12px;
      padding: 1.25rem 1.5rem; margin-bottom: 1.5rem; max-width: 1200px; width: 100%;
    }
    .instructions h2 { font-size: 1rem; margin-bottom: 0.75rem; color: #fbbf24; }
    .instructions ol {
      padding-left: 1.25rem; font-size: 0.85rem; color: #94a3b8; line-height: 1.8;
    }
  </style>
</head>
<body>

  <!-- Presentation mode toggle -->
  <button class="pres-btn" id="pres-btn" onclick="togglePresentation()"></button>

  <!-- Language toggle -->
  <div class="lang-toggle">
    <button class="lang-btn active" data-lang="es">ES</button>
    <button class="lang-btn" data-lang="en">EN</button>
  </div>

  <h1 id="page-title"></h1>
  <p class="subtitle" id="page-subtitle"></p>

  <div class="instructions">
    <h2 id="instructions-title"></h2>
    <ol id="instructions-list"></ol>
  </div>

  <div class="tabs" id="technique-tabs"></div>
  <div class="technique-info" id="technique-info"></div>

  <div class="container">
    <div class="fake-site">
      <h2 id="form-title"></h2>
      <p class="tagline" id="form-tagline"></p>
      <form id="trap-form" autocomplete="on">
        <label for="visible-name" id="label-name"></label>
        <input type="text" id="visible-name" name="name" autocomplete="name">
        <label for="visible-email" id="label-email"></label>
        <input type="email" id="visible-email" name="email" autocomplete="email">
        <div id="hidden-container"></div>
        <button type="submit" id="submit-btn"></button>
      </form>
    </div>

    <div class="results">
      <h2 id="results-title"></h2>
      <div id="results-list"></div>
      <div class="warning-box" id="warning-text"></div>
    </div>
  </div>

  <div class="score-panel" id="score-panel">
    <div class="score-header">
      <h2 id="score-title"></h2>
      <button class="reset-btn" id="reset-btn" onclick="resetAll()"></button>
    </div>
    <div class="score-stats" id="score-stats"></div>
    <div class="score-bar-container">
      <div class="score-bar" id="score-bar"></div>
    </div>
    <p class="score-bar-label" id="score-bar-label"></p>
  </div>

  <div class="comparison">
    <h2 id="comparison-title"></h2>
    <div id="browser-info" style="display:flex;gap:1.5rem;flex-wrap:wrap;margin-bottom:1rem;padding:0.75rem 1rem;background:#0f172a;border-radius:8px;font-size:0.8rem;"></div>
    <div style="overflow-x:auto;">
    <table>
      <thead id="comparison-thead"></thead>
      <tbody id="comparison-body"></tbody>
    </table>
    </div>
    <p id="comparison-legend" style="margin-top:1rem;font-size:0.75rem;color:#64748b;"></p>
  </div>

  <div class="recs-panel" id="recs-panel">
    <h2 id="recs-title"></h2>
    <div id="recs-severity" class="recs-severity"></div>
    <p class="recs-intro" id="recs-intro"></p>
    <div id="recs-list"></div>
  </div>

  <button class="qr-btn" id="qr-btn" onclick="toggleQR()"></button>
  <div class="qr-overlay" id="qr-overlay" onclick="if(event.target===this)toggleQR()">
    <div class="qr-modal">
      <h3 id="qr-title"></h3>
      <p id="qr-desc"></p>
      <canvas id="qr-canvas" style="display:none;"></canvas>
      <img id="qr-img" alt="QR Code" style="border-radius:8px;width:200px;height:200px;">
      <div class="qr-url" id="qr-url"></div>
      <br><button class="qr-close" onclick="toggleQR()" id="qr-close"></button>
    </div>
  </div>

      '<th rowspan="2" style="border-left:2px solid #334155;">' + T('thTotal') + '</th>' +
    '</tr><tr>' +

      '<th style="border-left:2px solid #334155;">' + T('thPhone') + '</th><th>' + T('thAddr') + '</th><th>' + T('thCard') + '</th>' +
      '<th style="border-left:2px solid #334155;">' + T('thTel') + '</th><th>' + T('thDir') + '</th><th>' + T('thCard') + '</th>' +
      '<th style="border-left:2px solid #334155;">' + T('thTelPH') + '</th><th>' + T('thCCPH') + '</th>' +

  document.getElementById('comparison-legend').innerHTML =

    '<span class="status-blocked">' + T('legendBlocked') + '</span> ' + T('legendBlockedDesc') + ' &nbsp;|&nbsp; ' +
    '<span class="status-pending">' + T('legendPending') + '</span> ' + T('legendPendingDesc');

// ============================================================
// RENDER TABS
// ============================================================
var tabsContainer = document.getElementById('technique-tabs');
techniques.forEach(function (t, i) {
  var btn = document.createElement('button');
  btn.className = 'tab-btn' + (i === 0 ? ' active' : '');

// ============================================================
// SELECT TECHNIQUE
// ============================================================
function selectTechnique(t) {
  activeTechnique = t;

  document.querySelectorAll('.tab-btn').forEach(function (btn) {
    btn.classList.toggle('active', btn.dataset.id === t.id);
  });

  document.getElementById('technique-info').innerHTML =
    '<h3>' + t.name + '</h3>' +
    '<div class="css-code">' + escapeHtml(t.css) + '</div>' +
    '<p class="expectation">' + T(t.descKey + '_desc') + '</p>' +
    '<p class="expectation" style="margin-top:0.5rem;">' + T('expectedBehavior') + ': ' + T(t.descKey + '_exp') + '</p>';

  var techLabel = document.getElementById('current-technique-label');
  if (techLabel) techLabel.textContent = t.name;

  rebuildHiddenFields(t.className);

  var form = document.getElementById('trap-form');
  form.reset();
  form.querySelector('button').textContent = T('submitBtn');
  form.querySelector('button').style.background = '#6366f1';

  document.getElementById('results-list').innerHTML =
    '<p style="color:#475569;font-size:0.85rem;">' + T('resultsEmpty') + '</p>';
}

function rebuildHiddenFields(className) {
  var container = document.getElementById('hidden-container');
  container.innerHTML = '';
  var useDetails = activeTechnique.useDetails;
  var wrapper;

  if (useDetails) {
    wrapper = document.createElement('details');
    wrapper.className = className;
    wrapper.setAttribute('aria-hidden', 'true');
    var summary = document.createElement('summary');
    summary.textContent = '';
    wrapper.appendChild(summary);
  } else {
    wrapper = document.createElement('div');
    wrapper.className = className;
    wrapper.setAttribute('aria-hidden', 'true');
  }

  hiddenFields.forEach(function (f) {
    var input = document.createElement('input');
    input.type = 'text';
    input.name = f.name;
    input.tabIndex = -1;
    if (f.autocomplete && f.autocomplete !== 'off') {
      input.setAttribute('autocomplete', f.autocomplete);
    }
    if (f.placeholder) input.placeholder = f.placeholder;
    wrapper.appendChild(input);
  });

  container.appendChild(wrapper);
}

// ============================================================
// FORM SUBMIT — CAPTURE RESULTS
// ============================================================
var form = document.getElementById('trap-form');
form.addEventListener('submit', function (e) {
  e.preventDefault();

  var html = '';
  var capturedHidden = 0;
  var techniqueResult = {};

  // Visible fields
  visibleFields.forEach(function (f) {
    var value = form.elements[f.name] ? form.elements[f.name].value.trim() : '';
    html += '<div class="result-row">' +
      '<span class="result-label">' + T(f.labelKey) + '<span class="badge visible">' + T('badgeVisible') + '</span></span>' +
      '<span class="result-value' + (value ? '' : ' empty') + '">' + (value || T('empty')) + '</span></div>';
  });

  // Hidden fields grouped by category
  var lastCategory = '';
  hiddenFields.forEach(function (f) {
    var input = form.elements[f.name];
    var value = input ? input.value.trim() : '';
    var filled = !!value;
    techniqueResult[f.name] = filled;
    if (filled) capturedHidden++;

    if (f.category !== lastCategory) {
      lastCategory = f.category;
      var strategyLabel = f.strategy === 'autocomplete' ? 'autocomplete attr' :
                          f.strategy === 'placeholder' ? 'placeholder heuristic' : 'name/id heuristic';
      html += '<div style="margin-top:0.75rem;padding:0.35rem 0.5rem;background:#0f172a;border-radius:4px;font-size:0.7rem;color:#6366f1;font-weight:600;">' +
        f.category + ' <span style="color:#475569;font-weight:400;">(' + strategyLabel + ')</span></div>';
    }

    var displayValue = value || T('empty');
    if ((f.name === 'h-ccnum' || f.name === 'card_number' || f.name === 'credit_card' || f.name === 'numero_tarjeta') && value.length > 4) {
      displayValue = '*'.repeat(value.length - 4) + value.slice(-4);
    }
    if ((f.name === 'h-cccsc' || f.name === 'cvv' || f.name === 'ssn') && value.length > 0) {
      displayValue = '*'.repeat(value.length);
    }

    var badgeClass = filled ? 'hidden' : 'blocked';
    var badgeText = filled ? T('badgeCaptured') : T('badgeBlocked');

    html += '<div class="result-row">' +
      '<span class="result-label">' + f.label + '<span class="badge ' + badgeClass + '">' + badgeText + '</span></span>' +
      '<span class="result-value ' + (filled ? 'captured' : 'empty') + '">' + displayValue + '</span></div>';
  });

  if (capturedHidden > 0) {
    html = '<div style="background:#7f1d1d;padding:0.6rem 1rem;border-radius:8px;margin-bottom:1rem;font-size:0.85rem;color:#fca5a5;">' +
      T('hiddenCaptured').replace('{n}', capturedHidden).replace('{t}', hiddenFields.length) + '</div>' + html;
  } else {
    html = '<div style="background:#14532d;padding:0.6rem 1rem;border-radius:8px;margin-bottom:1rem;font-size:0.85rem;color:#86efac;">' +
      T('hiddenZero') + '</div>' + html;
  }

  document.getElementById('results-list').innerHTML = html;
  comparisonResults[activeTechnique.id] = techniqueResult;
  renderComparison();
  updateTabColors();
});

// ============================================================
// RESET ALL
// ============================================================
function resetAll() {
  comparisonResults = {};
  selectTechnique(techniques[0]);
  renderComparison();
  updateTabColors();
  document.getElementById('recs-panel').classList.remove('visible');
}

// ============================================================
// UPDATE TAB COLORS BASED ON RESULTS
// ============================================================
function updateTabColors() {
  document.querySelectorAll('.tab-btn').forEach(function (btn) {
    var techId = btn.dataset.id;
    var result = comparisonResults[techId];
    btn.classList.remove('result-filled', 'result-blocked');
    if (result) {
      var filled = 0;
      hiddenFields.forEach(function (f) { if (result[f.name]) filled++; });
      btn.classList.add(filled > 0 ? 'result-filled' : 'result-blocked');
    }
  });
}

// ============================================================
// LIVE MONITORING
// ============================================================
setInterval(function () {
  var filled = 0;
  hiddenFields.forEach(function (f) {
    var input = form.elements[f.name];
    if (input && input.value.trim()) filled++;
  });
  var btn = form.querySelector('button');

// ============================================================
// COMPARISON TABLE
// ============================================================
var comparisonFields = [
  { name: 'h-phone',        border: true },
  { name: 'h-street',       border: false },
  { name: 'h-ccnum',        border: false },
  { name: 'phone_number',   border: true },
  { name: 'address',        border: false },
  { name: 'card_number',    border: false },
  { name: 'telefono',       border: true },
  { name: 'direccion',      border: false },
  { name: 'numero_tarjeta', border: false },
  { name: 'field_a',        border: true },
  { name: 'field_d',        border: false },
];

function renderComparison() {
  var tbody = document.getElementById('comparison-body');
  var html = '';

  techniques.forEach(function (t) {
    var result = comparisonResults[t.id];
    html += '<tr><td><strong>' + t.name + '</strong></td>';

    comparisonFields.forEach(function (cf) {
      var bs = cf.border ? 'border-left:2px solid #334155;' : '';
      if (!result) {
        html += '<td class="status-pending" style="' + bs + '">--</td>';
      } else if (result[cf.name]) {
        html += '<td class="status-filled" style="' + bs + '">FILLED</td>';
      } else {
        html += '<td class="status-blocked" style="' + bs + '">BLOCKED</td>';
      }
    });

    if (!result) {
      html += '<td class="status-pending" style="border-left:2px solid #334155;">' + T('notTested') + '</td>';
    } else {
      var tot = 0;
      hiddenFields.forEach(function (f) { if (result[f.name]) tot++; });
      if (tot === 0) {
        html += '<td class="status-blocked" style="border-left:2px solid #334155;">0/' + hiddenFields.length + '</td>';
      } else {
        html += '<td class="status-filled" style="border-left:2px solid #334155;">' + tot + '/' + hiddenFields.length + '</td>';
      }
    }
    html += '</tr>';
  });

  tbody.innerHTML = html;
  renderScore();
}

// ============================================================
// VULNERABILITY SCORE
// ============================================================
function renderScore() {
  var panel = document.getElementById('score-panel');
  var testedIds = Object.keys(comparisonResults);
  var tested = testedIds.length;

  if (tested === 0) {
    panel.classList.remove('visible');
    return;
  }
  panel.classList.add('visible');

  var vulnerable = 0;
  var safe = 0;
  var totalFields = 0;

  testedIds.forEach(function (id) {
    var result = comparisonResults[id];
    var filled = 0;
    hiddenFields.forEach(function (f) { if (result[f.name]) filled++; });
    totalFields += filled;
    if (filled > 0) vulnerable++;
    else safe++;
  });

  var totalTechniques = techniques.length;
  var vulnPct = Math.round((vulnerable / totalTechniques) * 100);

  // Colors and level
  var barColor, level;
  if (vulnPct === 0) {
    barColor = '#22c55e'; level = T('scoreLevelSafe');
  } else if (vulnPct <= 25) {
    barColor = '#4ade80'; level = T('scoreLevelLow');
  } else if (vulnPct <= 50) {
    barColor = '#fbbf24'; level = T('scoreLevelMedium');
  } else if (vulnPct <= 75) {
    barColor = '#f97316'; level = T('scoreLevelHigh');
  } else {
    barColor = '#ef4444'; level = T('scoreLevelCritical');
  }

  document.getElementById('score-title').textContent = T('scoreTitle');

  document.getElementById('score-stats').innerHTML =
    '<div class="score-stat"><div class="number" style="color:#94a3b8;">' + tested + '/' + totalTechniques + '</div><div class="label">' + T('scoreTested') + '</div></div>' +
    '<div class="score-stat"><div class="number" style="color:#f87171;">' + vulnerable + '</div><div class="label">' + T('scoreVulnerable') + '</div></div>' +
    '<div class="score-stat"><div class="number" style="color:#4ade80;">' + safe + '</div><div class="label">' + T('scoreSafe') + '</div></div>' +
    '<div class="score-stat"><div class="number" style="color:#fbbf24;">' + totalFields + '</div><div class="label">' + T('scoreFields') + '</div></div>';

  var bar = document.getElementById('score-bar');
  bar.style.width = Math.max(vulnPct, 8) + '%';
  bar.style.background = barColor;
  bar.textContent = vulnPct + '%';

  document.getElementById('score-bar-label').textContent = level;
  renderRecommendations(vulnPct, vulnerable, totalFields);
}

function renderRecommendations(vulnPct, vulnerable, totalFields) {
  var panel = document.getElementById('recs-panel');
  panel.classList.add('visible');

  document.getElementById('recs-title').textContent = T('recsTitle');
  document.getElementById('recs-intro').textContent = T('recsIntro');

  // Severity message
  var sevEl = document.getElementById('recs-severity');
  var sevClass, sevText;
  if (vulnPct === 0) { sevClass = 'safe'; sevText = T('recSeveritySafe'); }
  else if (vulnPct <= 25) { sevClass = 'low'; sevText = T('recSeverityLow'); }
  else if (vulnPct <= 50) { sevClass = 'medium'; sevText = T('recSeverityMedium'); }
  else if (vulnPct <= 75) { sevClass = 'high'; sevText = T('recSeverityHigh'); }
  else { sevClass = 'critical'; sevText = T('recSeverityCritical'); }
  sevEl.className = 'recs-severity ' + sevClass;
  sevEl.textContent = sevText;

  // Build recommendations list (prioritized by results)
  var recs = [];

  if (vulnPct > 50) {
    recs.push({ icon: '1', titleKey: 'recDisableAutofill', descKey: 'recDisableAutofillDesc' });
  }

  if (totalFields > 0) {
    recs.push({ icon: '2', titleKey: 'recNoCards', descKey: 'recNoCardsDesc' });
  }

  recs.push({ icon: '3', titleKey: 'recUsePM', descKey: 'recUsePMDesc' });
  recs.push({ icon: '4', titleKey: 'recCheckFields', descKey: 'recCheckFieldsDesc' });
  recs.push({ icon: '5', titleKey: 'recKeepUpdated', descKey: 'recKeepUpdatedDesc' });

  if (vulnPct <= 50 && vulnPct > 0) {
    recs.push({ icon: '6', titleKey: 'recDisableAutofill', descKey: 'recDisableAutofillDesc' });
  }

  // Re-number icons
  var html = '';
  recs.forEach(function (rec, i) {
    html += '<div class="rec-item">' +
      '<div class="rec-icon">' + (i + 1) + '</div>' +
      '<div class="rec-content"><h4>' + T(rec.titleKey) + '</h4>' +
      '<p>' + T(rec.descKey) + '</p></div></div>';
  });

  document.getElementById('recs-list').innerHTML = html;
}

// ============================================================
// PASSWORD MANAGER DETECTION
// ============================================================
function detectPasswordManagers() {
  var detected = [];

  // 1Password
  if (document.querySelector('[data-com-onepassword-filled]') ||
      document.querySelector('com-1password-notification') ||
      document.querySelector('com-1password-menu') ||
      document.querySelector('[data-onepassword-title]')) {
    detected.push('1Password');
  }

  // Bitwarden
  if (document.querySelector('[data-bwautofill]') ||
      document.querySelector('div[bitwardenvaultpopup]') ||
      document.querySelector('.bitwarden-copy-toast') ||
      document.querySelector('span[data-bwautofill]')) {
    detected.push('Bitwarden');
  }

  // LastPass
  if (document.querySelector('[data-lastpass-icon-root]') ||
      document.querySelector('[data-lastpass-root]') ||
      document.querySelector('div[id^="__lpform"]') ||
      typeof document.querySelector('[data-lpignore]') !== null && document.querySelectorAll('[style*="lastpass"]').length > 0) {
    detected.push('LastPass');
  }

  // Dashlane
  if (document.querySelector('[data-dashlanecreated]') ||
      document.querySelector('span[data-dashlane]') ||
      document.querySelector('[data-dashlane-rid]')) {
    detected.push('Dashlane');
  }

  // NordPass
  if (document.querySelector('[data-nordpass]') ||
      document.querySelector('np-autofill-popup')) {
    detected.push('NordPass');
  }

  // RoboForm
  if (document.querySelector('[data-roboform]') ||
      document.querySelector('rf-notification')) {
    detected.push('RoboForm');
  }

  // Keeper
  if (document.querySelector('[data-keeper]') ||
      document.querySelector('.keeper-lock-hover')) {
    detected.push('Keeper');
  }

  // Generic: check for any extension-injected icons in inputs
  var inputs = document.querySelectorAll('input');
  inputs.forEach(function (input) {
    var style = window.getComputedStyle(input);
    var bg = style.backgroundImage || '';
    if (bg.indexOf('extension://') > -1 && detected.length === 0) {
      detected.push('Unknown extension');
    }
  });

  return detected;
}

// ============================================================
// BROWSER DETECTION
// ============================================================
function detectBrowser() {
  var ua = navigator.userAgent;
  var browser = '?', version = '', engine = '';

  if (ua.indexOf('Firefox') > -1) { browser = 'Firefox'; version = (ua.match(/Firefox\/([\d.]+)/) || [])[1] || ''; engine = 'Gecko'; }
  else if (ua.indexOf('Edg/') > -1) { browser = 'Edge'; version = (ua.match(/Edg\/([\d.]+)/) || [])[1] || ''; engine = 'Chromium'; }
  else if (ua.indexOf('OPR/') > -1) { browser = 'Opera'; version = (ua.match(/OPR\/([\d.]+)/) || [])[1] || ''; engine = 'Chromium'; }
  else if (ua.indexOf('Chrome') > -1) { browser = 'Chrome'; version = (ua.match(/Chrome\/([\d.]+)/) || [])[1] || ''; engine = 'Chromium'; }
  else if (ua.indexOf('Safari') > -1) { browser = 'Safari'; version = (ua.match(/Version\/([\d.]+)/) || [])[1] || ''; engine = 'WebKit'; }

  if (navigator.brave && typeof navigator.brave.isBrave === 'function') { browser = 'Brave'; engine = 'Chromium'; }

  var platform = '?';
  if (ua.indexOf('Win') > -1) platform = 'Windows';
  else if (ua.indexOf('Mac') > -1) platform = 'macOS';
  else if (ua.indexOf('Linux') > -1) platform = 'Linux';
  else if (ua.indexOf('Android') > -1) platform = 'Android';
  else if (/iPhone|iPad/.test(ua)) platform = 'iOS';

  return { browser: browser, version: version, engine: engine, platform: platform };
}

function renderBrowserInfo() {
  var info = detectBrowser();
  var locale = currentLang === 'es' ? 'es-AR' : 'en-US';
  var dateStr = new Date().toLocaleDateString(locale) + ' ' + new Date().toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit' });

  var pms = detectPasswordManagers();
  var pmValue = pms.length > 0
    ? '<span style="color:#fbbf24;">' + pms.join(', ') + '</span>'
    : '<span style="color:#4ade80;">' + T('pmNone') + '</span>';

  var items = [
    { label: T('browserLabel'), value: info.browser + ' ' + info.version },
    { label: T('engineLabel'),  value: info.engine },
    { label: T('platformLabel'), value: info.platform },
    { label: T('pmLabel'), value: pmValue, isHtml: true },
    { label: T('testDateLabel'), value: dateStr },
  ];

  document.getElementById('browser-info').innerHTML = items.map(function (item) {
    if (item.isHtml) {
      return '<div><span style="color:#475569;">' + item.label + ':</span> <strong>' + item.value + '</strong></div>';
    }
    return '<div><span style="color:#475569;">' + item.label + ':</span> <strong style="color:#f8fafc;">' + item.value + '</strong></div>';
  }).join('');
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ============================================================
// PRESENTATION MODE
// ============================================================
var presentationMode = false;

function togglePresentation() {
  presentationMode = !presentationMode;
  document.body.classList.toggle('presentation-mode', presentationMode);
  document.getElementById('pres-btn').classList.toggle('active', presentationMode);
}

document.addEventListener('keydown', function (e) {
  if (!presentationMode) return;
  var currentIdx = techniques.indexOf(activeTechnique);
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    e.preventDefault();
    var next = (currentIdx + 1) % techniques.length;
    selectTechnique(techniques[next]);
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault();
    var prev = (currentIdx - 1 + techniques.length) % techniques.length;
    selectTechnique(techniques[prev]);
  } else if (e.key === 'Escape') {
    togglePresentation();
  }
});

// ============================================================
// QR CODE (using qrcode-generator library)
// ============================================================
function toggleQR() {
  var overlay = document.getElementById('qr-overlay');
  var isVisible = overlay.classList.contains('visible');
  if (isVisible) {
    overlay.classList.remove('visible');
  } else {
    overlay.classList.add('visible');
    generateQR();
  }
}

function generateQR() {
  var url = window.location.href;
  document.getElementById('qr-url').textContent = url;
  var img = document.getElementById('qr-img');
  try {
    var qr = qrcode(0, 'L');
    qr.addData(url);
    qr.make();
    var size = qr.getModuleCount();
    var cellSize = Math.floor(200 / size);
    var canvas = document.getElementById('qr-canvas');
    canvas.width = cellSize * size;
    canvas.height = cellSize * size;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#000000';
    for (var r = 0; r < size; r++) {
      for (var c = 0; c < size; c++) {
        if (qr.isDark(r, c)) {
          ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
        }
      }
    }
    img.src = canvas.toDataURL('image/png');
  } catch (e) {
    img.alt = 'QR generation failed';
  }
}

applyLanguage();

// Re-check for password managers after extensions load (delayed injection)
setTimeout(renderBrowserInfo, 2000);
setTimeout(renderBrowserInfo, 5000);
